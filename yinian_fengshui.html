const LEAD_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzdsz450B7XhwQyTJDpdZtR4hDgP9sMdmhkFVg_BB8e8UU6klJH6JAZ6GqkApGD7ZCh/exec";

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function getDeviceInfo() {
  const ua = navigator.userAgent || "";
  let deviceType = "桌機 Desktop";
  if (/iPad|Tablet/i.test(ua)) deviceType = "平板 Tablet";
  else if (/Mobi|Android|iPhone/i.test(ua)) deviceType = "手機 Mobile";

  let os = "未知";
  if (/Windows/i.test(ua)) os = "Windows";
  else if (/iPhone|iPad|iOS/i.test(ua)) os = "iOS";
  else if (/Mac OS/i.test(ua)) os = "macOS";
  else if (/Android/i.test(ua)) os = "Android";
  else if (/Linux/i.test(ua)) os = "Linux";

  let browser = "未知";
  if (/Edg\//i.test(ua)) browser = "Edge";
  else if (/Chrome\//i.test(ua) && !/Chromium/i.test(ua)) browser = "Chrome";
  else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
  else if (/Firefox\//i.test(ua)) browser = "Firefox";

  return {
    deviceType,
    os,
    browser,
    userAgent: ua,
    language: navigator.language || "",
    screen: screen.width + "x" + screen.height,
    referrer: document.referrer || "(直接訪問)"
  };
}

// 透過免費 IP 定位 API 取得大略地區（城市/國家），失敗則忽略不影響送出
async function getGeoInfo() {
  try {
    const res = await fetch("https://ipwho.is/");
    const data = await res.json();
    if (data && data.success !== false) {
      return {
        country: data.country || "",
        region: data.region || "",
        city: data.city || "",
        ip: data.ip || ""
      };
    }
  } catch (e) {}
  return { country: "", region: "", city: "", ip: "" };
}

async function submitLead() {
  const emailInput = document.getElementById("leadEmail");
  const email = emailInput.value.trim();
  const errorBox = document.getElementById("leadError");
  const btn = document.querySelector(".lead-btn");

  if (!isValidEmail(email)) {
    emailInput.classList.add("invalid");
    errorBox.style.display = "block";
    emailInput.focus();
    return;
  }
  emailInput.classList.remove("invalid");
  errorBox.style.display = "none";

  const resultType = localStorage.getItem("yinian_last_result") || "unknown";
  const device = getDeviceInfo();

  btn.disabled = true;
  btn.textContent = "送出中…";

  const geo = await getGeoInfo();

  const payload = {
    email,
    resultType,
    date: new Date().toISOString(),
    ...device,
    ...geo,
    pageUrl: location.href
  };

  // 本地備份一份（方便除錯，不影響主要流程）
  const leads = JSON.parse(localStorage.getItem("yinian_leads") || "[]");
  leads.push({
    contact: contact || "未填寫(訪客)",
    type: resultType,
    date: new Date().toISOString()
  });
  leads.push(payload);
  localStorage.setItem("yinian_leads", JSON.stringify(leads));

  // 送到 Google 試算表
  if (LEAD_WEBHOOK_URL && LEAD_WEBHOOK_URL.indexOf("PASTE_YOUR") === -1) {
    try {
      await fetch(LEAD_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
    } catch (e) {
      console.warn("送出至 Google 試算表失敗：", e);
    }
  } else {
    console.warn("尚未設定 LEAD_WEBHOOK_URL，名單僅保存在本機瀏覽器。");
  }

  document.getElementById("leadForm").style.display = "none";
  const successBox = document.getElementById("leadSuccess");
  successBox.style.display = "block";
  if(contact) {
    successBox.textContent = "✨ 登記成功！已為您備妥專屬 7 日轉念微行動指引，藏寶圖將發送至：" + contact;
  }
  successBox.textContent = "✨ 登記成功！已為您備妥專屬 7 日轉念微行動指引，藏寶圖將發送至：" + email;
}
